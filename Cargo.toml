[workspace]
resolver = "2"
members = ["crates/pat-core", "crates/pat-cli", "crates/pat-py"]
# pat-py is a Python extension module; build it with maturin, not plain cargo.
default-members = ["crates/pat-core", "crates/pat-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/acmeanvil/Pat"
rust-version = "1.82"

[workspace.dependencies]
pat-core = { path = "crates/pat-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
clap = { version = "4", features = ["derive"] }

# Geometry and simulation code is numeric; unoptimised builds make tests slow.
[profile.dev]
opt-level = 2
