# Head-table 5-axis: B tilts the spindle head about Y, C turns the table.
name = "Generic head-table BC"
description = "B head tilting about Y (pivot 180 mm above the gauge line) over a C rotary table"
default_tool_length = 120.0
wcs_origin = [0.0, 0.0, 0.0]   # part zero on the C axis at table top

[spindle]
gauge_point = [0.0, 0.0, 400.0]

[[axes]]
name = "X"
kind = "linear"
chain = "head"
direction = [1.0, 0.0, 0.0]
min = -600.0
max = 600.0
max_rate = 30000.0
max_accel = 4000.0

[[axes]]
name = "Y"
kind = "linear"
chain = "table"
direction = [0.0, -1.0, 0.0]   # the table moves; +Y moves it toward the operator
min = -400.0
max = 400.0
max_rate = 30000.0
max_accel = 4000.0

[[axes]]
name = "Z"
kind = "linear"
chain = "head"
direction = [0.0, 0.0, 1.0]
min = -500.0
max = 100.0
max_rate = 30000.0
max_accel = 4000.0

[[axes]]
name = "B"
kind = "rotary"
chain = "head"
direction = [0.0, 1.0, 0.0]
point = [0.0, 0.0, 580.0]
min = -110.0
max = 110.0
max_rate = 6000.0
max_accel = 2000.0

[[axes]]
name = "C"
kind = "rotary"
chain = "table"
direction = [0.0, 0.0, -1.0]
point = [0.0, 0.0, 0.0]
max_rate = 9000.0
max_accel = 3000.0
